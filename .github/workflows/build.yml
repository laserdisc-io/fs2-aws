name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
      - name: Setup sbt
        uses: sbt/setup-sbt@v1.5.9
      - name: Cache SBT
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier/v1
            ~/.sbt
          key: sbt-${{ hashFiles('**/build.sbt') }}
      - name: Check generated pure-aws sources are up to date
        run: |
          make generate-pure-aws
          # Make a generated file that was never committed show up in git diff.
          git add --intent-to-add -- pure-aws
          git diff --exit-code -- pure-aws || {
            echo "::error::Files under pure-aws/ differ from the taglessGen output. Don't edit them by hand. Run 'make generate-pure-aws' and commit the result. See AGENTS.md."
            exit 1
          }
      - name: "Starting up LocalStack 🐳"
        run: docker compose up -d
      - name: Run tests
        run: sbt +clean +test +doc
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
      - name: "Shutting down LocalStack 🐳"
        run: docker compose down
