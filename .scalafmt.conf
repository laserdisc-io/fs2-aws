version=3.9.10

maxColumn = 120

style = default
align.preset = more

project.layout = StandardConvention
runner.dialect = scala3


// for these generated sources, the type signatures get long, it's tidier just to let them run on imo
fileOverride {
  "lang:scala-2" = scala213source3

  "glob:**/Interpreter.scala" {
    maxColumn = 300
  }
  "glob:**/*AsyncClientOps.scala" {
    maxColumn = 300
  }
}

danglingParentheses.preset = true
docstrings.wrap = "no"

rewrite.rules = [
  AvoidInfix
  RedundantBraces
  RedundantParens
  AsciiSortImports
  PreferCurlyFors
  SortModifiers
  Imports
]

rewrite.neverInfix.excludeFilters = [until
  to
  by
  eq
  ne
  "should.*"
  "contain.*"
  "must.*"
  in
  be
  taggedAs
  thrownBy
  synchronized
  have
  when
  size
  theSameElementsAs
  at
  can
  should]

rewrite.imports.sort = original
newlines.implicitParamListModifierPrefer = before